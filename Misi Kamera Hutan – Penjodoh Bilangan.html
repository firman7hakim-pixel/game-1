 if(st==='menu'){camX=(1+Math.sin(t*.15))/2*(LW-VW);walk=0;return}
 idle+=dt;let d=(K.rt?1:0)-(K.lf?1:0);if(K.up)cy-=240*dt;if(K.dn)cy+=240*dt;if(emouse){if(cx<45)d=-1;else if(cx>VW-45)d=1}
 walk=d;camX=Math.max(0,Math.min(LW-VW,camX+d*270*dt));cx=Math.max(65,Math.min(VW-65,cx));cy=Math.max(55,Math.min(390,cy));foc=null;let bd=1e9;
 items.forEach(it=>{const dx=it.x-camX-cx,dy=it.y-cy;it.inb=!it.done&&Math.abs(dx)<65&&Math.abs(dy)<55;if(it.inb&&dx*dx+dy*dy<bd){bd=dx*dx+dy*dy;foc=it}})}
function snap(){if(st!=='play')return;if(!foc){toast('Halakan kamera pada objek dahulu!',1.8);sfx.bad();return}shot=foc;snapReq=true;flash=1;sfx.sh()}
function photo(){const k=S*dpr;pctx.fillStyle='#fff';pctx.fillRect(0,0,200,170);pctx.drawImage(cv,(cx-65)*k,(cy-55)*k,130*k,110*k,0,0,200,170);
 const url=phc.toDataURL('image/jpeg',.82),it=shot,o=it.o,m=G.cur,good=o.pj===m,pol='<div class="pol"><img src="'+url+'"><div>'+o.pj+' '+o.n+'</div></div>';st='photo';
 if(good){const bonus=(performance.now()-mt0)<25000?5:0;G.score+=10+bonus;G.ok++;it.done=true;const s='Di hutan ada '+o.pj.toLowerCase()+' '+o.n+'.';AL.push({pj:o.pj,n:o.n,e:o.e,img:url,s});hud();sfx.ok();
  modal(`<div class='fb'><div>${pol}</div><div class='tx'><h2 class='good'>✅ Hebat!</h2><p class='big'>Ini <b class='gc'>${o.pj.toLowerCase()}</b> ${o.n}.</p><p>Penjodoh bilangan <b class='gc'>${o.pj.toLowerCase()}</b> digunakan untuk ${o.n}.</p><div class='ex'><b>Contoh ayat:</b><br>${s}</div><p class='sm'>⭐ +${10+bonus}${bonus?' (bonus cepat ⚡)':''} · 📒 Disimpan dalam album</p></div></div>`,[['MISI SETERUSNYA ▶',next,'g']])}
 else{G.bad++;sfx.bad();modal(`<div class='fb'><div>${pol}</div><div class='tx'><h2 class='bad'>❌ Cuba lagi!</h2><p class='big'>Ini <b class='gc'>${o.pj.toLowerCase()}</b> ${o.n}, bukan <b>${m.toLowerCase()}</b>.</p><p>Penjodoh bilangan <b class='gc'>${o.pj.toLowerCase()}</b> digunakan untuk ${o.n}.</p><div class='ex'><b>Contoh ayat:</b><br>Di hutan ada ${o.pj.toLowerCase()} ${o.n}.</div><p class='sm'>Misi: cari objek bagi <b>${m.toUpperCase()}</b></p></div></div>`,[['CUBA LAGI',()=>{unmod();st='play'},'r']])}}
function next(){unmod();G.mi++;if(G.mi>=mis.length)return end();G.cur=mis[G.mi];idle=0;mt0=performance.now();st='play';hud();toast('Misi: Cari objek bagi '+G.cur.toUpperCase(),2.2)}
function end(){st='end';$('ctl').style.display='none';modal('<h2 class="good">🏆 MISI SELESAI!</h2><p>⭐ Jumlah markah: <b>'+G.score+'</b><br>📸 Gambar betul: <b>'+G.ok+' / '+mis.length+'</b> &nbsp; ❌ Cuba lagi: <b>'+G.bad+'</b></p><p><b>Objek ditemui:</b><br><span style="font-size:30px">'+AL.map(a=>a.e).join(' ')+'</span></p><p>'+AL.map(a=>a.pj+' '+a.n).join(' · ')+'</p>',[['MAIN SEMULA',newGame],['ALBUM',album,'b'],['MENU UTAMA',toMenu,'g']])}
function hud(){$('sc').textContent=G.score;$('ph').textContent=G.ok;$('ms').innerHTML='<small>Misi '+(G.mi+1)+' / '+mis.length+'</small><span>Cari objek bagi:</span><b>'+G.cur.toUpperCase()+'</b>';$('mn').textContent=(G.mi+1)+' / '+mis.length}
function toast(s,sec){const m=$('msg');m.textContent=s;m.style.display='block';m.classList.remove('pop');void m.offsetWidth;m.classList.add('pop');clearTimeout(toast.h);toast.h=setTimeout(()=>m.style.display='none',sec*1000)}
function modal(h,b){const m=$('mod');m.innerHTML='<div class="card">'+h+'<div class="bt"></div></div>';b.forEach(x=>{const e=document.createElement('button');e.className='btn '+(x[2]||'');e.textContent=x[0];e.onclick=()=>{au();sfx.click();x[1]()};m.querySelector('.bt').appendChild(e)});m.style.display='flex'}
const unmod=()=>$('mod').style.display='none',isOpen=()=>$('mod').style.display==='flex';
function album(){const back=st;let h=`<div class='book'><h2>📖 Album Gambar</h2><p class='kol'>⭐ Koleksi: <b>${AL.length} / 15</b></p><div class='gr'>`;
 AL.forEach(x=>{h+=`<div class='al'><img src='${x.img}'><b>${x.n}</b><small class='pjc'>${x.pj}</small><small>${x.s}</small></div>`});for(let i=AL.length;i<15;i++)h+="<div class='al q'>?</div>";h+='</div></div>';
 modal(h,[['TUTUP',()=>{unmod();if(back==='play'){st='play'}else if(back==='end')end()}]]);if(st==='play')st='paused'}
function newGame(){G={score:0,ok:0,bad:0,mi:0};AL=[];mis=shuffle(CATS.flatMap(c=>Array(MS[c]).fill(c)));G.cur=mis[0];init();camX=0;cx=VW/2;cy=230;unmod();$('menu').style.display='none';$('hud').style.display='block';$('ctl').style.display='flex';idle=0;mt0=performance.now();st='play';hud();toast('Misi: Cari objek bagi '+G.cur.toUpperCase(),2.2)}
function toMenu(){unmod();st='menu';$('hud').style.display='none';$('ctl').style.display='none';$('menu').style.display='flex';$('msg').style.display='none';init()}
function pause(){if(st==='play'){st='paused';modal('<h2>⏸ JEDA</h2>',[['SAMBUNG ▶',()=>{unmod();st='play'}],['MENU UTAMA',toMenu,'g']])}}
function tmute(){au();mute=!mute;$('mt').innerHTML=(mute?'🔇':'🔊')+'<small>Bunyi</small>';$('b5').textContent=mute?'🔇 BUNYI':'🔊 BUNYI'}
$('b1').onclick=()=>{au();sfx.click();newGame()};$('b3').onclick=()=>{au();album()};$('b5').onclick=tmute;$('mt').onclick=tmute;$('al').onclick=()=>{au();album()};$('pz').onclick=pause;$('pk').onclick=mapM;$('bs').onclick=snap;
$('b2').onclick=()=>{au();modal('<h2>CARA BERMAIN</h2><p>1️⃣ Baca penjodoh bilangan pada panel misi.<br>2️⃣ Berjalan di hutan: <b>A / D</b> atau ◀ ▶. Gerakkan tetikus ke tepi skrin juga boleh.<br>3️⃣ Halakan kamera: gerakkan <b>tetikus</b> (atau seret jari). Kekunci: <b>W / S</b> naik turun.<br>4️⃣ Bila kotak kamera menjadi <b style="color:#1fa65a">hijau</b>, objek itu boleh difoto.<br>5️⃣ Tekan <b>Space</b>, klik tetikus atau butang 📸.<br>6️⃣ Gambar yang betul disimpan dalam album!</p><p>⚡ Jawab dalam 25 saat untuk bonus +5.</p>',[['FAHAM!',unmod]])};
$('b4').onclick=()=>{au();modal('<h2>NOTA PENJODOH BILANGAN</h2><table><tr><td><b>Seekor</b></td><td>haiwan 🐱🐰🐦🦋</td></tr><tr><td><b>Sebatang</b></td><td>benda panjang ✏️🕯️🌲</td></tr><tr><td><b>Sebuah</b></td><td>benda besar 🏠🚗📖</td></tr><tr><td><b>Sehelai</b></td><td>benda nipis 📄👕🍃</td></tr><tr><td><b>Sepasang</b></td><td>dua benda sepadan 👟🧦</td></tr><tr><td><b>Sekuntum</b></td><td>bunga 🌹🌺</td></tr><tr><td><b>Sebiji</b></td><td>buah / benda bulat 🍎⚽</td></tr></table>',[['FAHAM!',unmod]])};
let emouse=false;
cv.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'){emouse=true;cx=e.clientX/S;cy=e.clientY/S}else if(e.buttons){cx=e.clientX/S;cy=e.clientY/S}});
cv.addEventListener('pointerdown',e=>{au();cx=e.clientX/S;cy=e.clientY/S;if(e.pointerType==='mouse'){emouse=true;snap()}else emouse=false});
document.querySelectorAll('.k[data-k]').forEach(b=>{const k=b.dataset.k,on=e=>{e.preventDefault();au();K[k]=1},off=()=>K[k]=0;b.onpointerdown=on;b.onpointerup=off;b.onpointerleave=off;b.onpointercancel=off});
const KM={ArrowLeft:'lf',a:'lf',A:'lf',ArrowRight:'rt',d:'rt',D:'rt',ArrowUp:'up',w:'up',W:'up',ArrowDown:'dn',s:'dn',S:'dn'};
addEventListener('keydown',e=>{const k=e.key;if(KM[k]){K[KM[k]]=1;emouse=false;e.preventDefault();au()}else if(k===' '){e.preventDefault();au();if(e.repeat)return;if(st==='menu'){if(!isOpen())newGame()}else if(st==='play')snap()}else if((k==='p'||k==='P'||k==='Escape')&&st==='play')pause()});
addEventListener('keyup',e=>{if(KM[e.key])K[KM[e.key]]=0});
init();let last=performance.now();(function loop(n){requestAnimationFrame(loop);const dt=Math.min(.05,(n-last)/1000);last=n;update(dt);render()})(last);
</script></body></html>
